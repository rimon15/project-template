[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app_name"
version = "0.0.1"
description = ""
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.1",
    "fancy-einsum>=0.0.3",
    "ipykernel>=7.1.0",
    "jaxtyping>=0.3.4",
    "lovely-tensors>=0.1.22",
    "matplotlib>=3.10.8",
    "pre-commit>=4.5.1",
    "rimutil[dl]>=0.1.4",
    "ruff>=0.14.9",
    "seaborn>=0.13.2",
    "torch>=2.9.1",
    "tqdm>=4.67.1",
    "wandb>=0.23.1",
]

[project.urls]
"Homepage" = "https://github.com/"

[tool.ruff]
indent-width = 2
line-length = 100
extend-include = ["*.ipynb"]
target-version = "py312"
respect-gitignore = true

[tool.ruff.isort]
lines-after-imports = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "F401"]

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
